name: Temporary Syn R4 Patch Executor

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write
  issues: write

jobs:
  apply:
    if: >-
      github.repository == 'knowurknottty/Flock-You-Android' &&
      github.event.pull_request.number == 6 &&
      github.event.pull_request.head.ref == 'maxstats/syn-runtime-r4'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact synchronized Syn head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact authority and source blobs
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 9dcde5dc83164a2a625eaec2bca451b46fb9c736 HEAD
          test "$(git hash-object tools/maxstats_syn_apply.py)" = "44ff7c2abce30e8ca89ee20407a6d43a5da6a3b4"
          test "$(git hash-object app/src/main/java/com/flockyou/service/ScanningService.kt)" = "8cd2b63553ccb9296e2f6137f391b6b2a7bc0d8c"
          test "$(git hash-object app/src/main/java/com/flockyou/service/ScanningServiceModels.kt)" = "a281f1c4f6f3d792723344720e7b0d69149c2e46"
          test "$(git hash-object app/src/main/java/com/flockyou/service/ScanningServiceState.kt)" = "c922b363d7500718d6557da7e9a4cc963c168c61"
          test "$(git hash-object app/src/main/AndroidManifest.xml)" = "c748c54af1aa4a33ce4f00afe389825e4a54fad8"
          test "$(git hash-object app/src/main/java/com/flockyou/service/ServiceRestartReceiver.kt)" = "de7b7d9ee5b3ab4802b4e9fb33a430d9d3be8c8c"
          test "$(git hash-object app/src/main/java/com/flockyou/service/SubsystemManager.kt)" = "22a1f1b0923fcbd0691261ae1f13253e821d1faf"
          python3 -m py_compile tools/maxstats_syn_apply.py

      - name: Apply assertion-guarded runtime patch
        run: python3 tools/maxstats_syn_apply.py

      - name: Validate generated production diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          test -n "$(git status --short app/src/main)"

      - name: Archive exact patched source
        uses: actions/upload-artifact@v4
        with:
          name: syn-r4-patched-source
          path: |
            app/src/main/AndroidManifest.xml
            app/src/main/java/com/flockyou/service/ScanningService.kt
            app/src/main/java/com/flockyou/service/ScanningServiceModels.kt
            app/src/main/java/com/flockyou/service/ScanningServiceState.kt
            app/src/main/java/com/flockyou/service/ScanningRuntimePolicy.kt
            app/src/main/java/com/flockyou/service/ServiceRestartReceiver.kt
            app/src/main/java/com/flockyou/service/SubsystemManager.kt

      - name: Commit and push production diff to Syn lane
        id: push
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/AndroidManifest.xml app/src/main/java/com/flockyou/service
          git diff --cached --check
          git diff --cached --stat
          git commit -m "perf: harden scanner runtime lifecycle"
          git push origin HEAD:maxstats/syn-runtime-r4

      - name: Report execution on PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_OUTCOME: ${{ steps.push.outcome }}
        shell: bash
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/6/comments" \
            -f body="Trusted Syn R4 executor run ${GITHUB_RUN_ID}: job=${{ job.status }}, push=${PUSH_OUTCOME:-not-run}."
