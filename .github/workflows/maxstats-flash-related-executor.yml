name: MAXSTATS Flash related-count executor

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: >-
      github.event.pull_request.number == 11 &&
      github.event.pull_request.head.ref == 'maxstats/flash-ui-r4' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audited Flash head
        uses: actions/checkout@v4
        with:
          ref: maxstats/flash-ui-r4
          fetch-depth: 0

      - name: Verify audited input blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object .github/scripts/apply_flash_related_counter.py)" = "4c96b3fe30c16c173da9e33104980d123a23ad62"
          test "$(git hash-object app/src/main/java/com/flockyou/ui/screens/MainViewModel.kt)" = "39d94409b3596a94cf13e0d0d17709e28f299edf"

      - name: Apply assertion-guarded source transform
        run: python3 .github/scripts/apply_flash_related_counter.py

      - name: Verify production-only diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | wc -l | tr -d ' ')" = "1"
          test "$(git diff --name-only)" = "app/src/main/java/com/flockyou/ui/screens/MainViewModel.kt"

      - name: Commit audited MainViewModel change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/flockyou/ui/screens/MainViewModel.kt
          git commit -m 'perf(ui): remove quadratic related-count recomputation'
          git push origin HEAD:maxstats/flash-ui-r4
