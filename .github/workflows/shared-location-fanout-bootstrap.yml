name: Shared location fanout bootstrap

on:
  push:
    branches:
      - perf/shared-location-fanout-r1
    paths:
      - .github/workflows/shared-location-fanout-bootstrap.yml
      - tools/shared_location_fanout_patch.py
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout performance branch
        uses: actions/checkout@v4
        with:
          ref: perf/shared-location-fanout-r1
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Apply shared location fanout optimization
        run: python3 tools/shared_location_fanout_patch.py

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Unit tests - sideload
        run: ./gradlew testsideloadDebugUnitTest --stacktrace --no-daemon

      - name: Build - sideload debug
        run: ./gradlew assemblesideloadDebug --stacktrace --no-daemon

      - name: Commit verified source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/flockyou/service/ScanningService.kt app/src/main/java/com/flockyou/service/SubsystemManager.kt
          git diff --cached --check
          git commit -m "perf: replace location polling loops with shared fanout"
          git pull --rebase origin perf/shared-location-fanout-r1
          git push origin HEAD:perf/shared-location-fanout-r1
