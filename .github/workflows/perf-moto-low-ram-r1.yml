name: Moto low-RAM performance bootstrap

on:
  push:
    branches:
      - perf/moto-low-ram-r1
    paths:
      - .github/workflows/perf-moto-low-ram-r1.yml
      - tools/perf_moto_patch_v2.py
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  optimize-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout optimization branch
        uses: actions/checkout@v4
        with:
          ref: perf/moto-low-ram-r1
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Apply constrained-device patch
        run: python3 tools/perf_moto_patch_v2.py

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Unit tests - sideload
        run: ./gradlew testsideloadDebugUnitTest --stacktrace --no-daemon

      - name: Build - sideload debug
        run: ./gradlew assemblesideloadDebug --stacktrace --no-daemon

      - name: Commit verified source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java app/src/test/java
          git diff --cached --check
          git commit -m "perf: optimize scanner for constrained Android devices"
          git push origin HEAD:perf/moto-low-ram-r1
