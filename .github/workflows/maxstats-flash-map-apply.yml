name: MAXSTATS Flash map patch

on:
  push:
    branches:
      - maxstats/flash-ui-r4

permissions:
  contents: write

jobs:
  apply-map-patch:
    if: github.event.head_commit.message == 'chore: trigger flash map patch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Flash branch
        uses: actions/checkout@v4
        with:
          ref: maxstats/flash-ui-r4
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply assertion-guarded map patch
        run: python .github/scripts/apply_flash_map_patch.py

      - name: Validate patch whitespace
        run: git diff --check

      - name: Commit production map patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/flockyou/ui/screens/MapScreen.kt
          git diff --cached --quiet && { echo 'Expected MapScreen patch produced no diff'; exit 1; }
          git commit -m 'perf(ui): coalesce map overlay work by zoom tier'
          git push origin HEAD:maxstats/flash-ui-r4
