name: MAXSTATS Flash trusted executor

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: >-
      github.event.pull_request.number == 11 &&
      github.event.pull_request.head.ref == 'maxstats/flash-ui-r4' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audited Flash head
        uses: actions/checkout@v4
        with:
          ref: maxstats/flash-ui-r4
          fetch-depth: 0

      - name: Verify audited input blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object .github/scripts/apply_flash_map_patch.py)" = "cd4815791d0ecd51cd0f91d8353bffc7635ac391"
          test "$(git hash-object app/src/main/java/com/flockyou/ui/screens/MapScreen.kt)" = "e06cd81402868d5bcc391c35617d8002b9b3cbde"

      - name: Apply assertion-guarded source transform
        run: python3 .github/scripts/apply_flash_map_patch.py

      - name: Verify production-only diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | wc -l | tr -d ' ')" = "1"
          test "$(git diff --name-only)" = "app/src/main/java/com/flockyou/ui/screens/MapScreen.kt"

      - name: Commit audited MapScreen change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/flockyou/ui/screens/MapScreen.kt
          git commit -m 'perf(ui): coalesce map overlay work by zoom tier'
          git push origin HEAD:maxstats/flash-ui-r4
